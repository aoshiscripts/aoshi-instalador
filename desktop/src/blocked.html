<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Proxy bloqueado</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin:0; height:100%; background:#0b0b0f; color:#e4e4e7; font:14px/1.5 system-ui, "Segoe UI", sans-serif; }
  .wrap { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .card { max-width:520px; width:100%; background:#18181b; border:1px solid #3f3f46; border-left:4px solid #dc2626; border-radius:14px; padding:26px 28px; box-shadow:0 20px 60px rgb(0 0 0 / .45); }
  .ico { width:46px; height:46px; border-radius:12px; background:rgb(220 38 38 / .15); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  h1 { margin:0 0 6px; font-size:19px; }
  p { margin:6px 0; color:#a1a1aa; }
  b { color:#fafafa; }
  .why { margin:14px 0; padding:10px 12px; border-radius:9px; background:#27272a; color:#fca5a5; font-size:13px; word-break:break-word; }
  .row { display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap; }
  button { border:0; border-radius:9px; padding:9px 16px; font:600 13px system-ui, sans-serif; background:#7c3aed; color:#fff; cursor:pointer; }
  button:hover { background:#6d28d9; }
  .meta { font-size:12px; color:#71717a; }
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 9l6 6M15 9l-6 6"/></svg></div>
  <h1>Conexão bloqueada para proteger o seu IP</h1>
  <p>O proxy <b id="p"></b> não passou na conferência, então esta aba não envia nada pela internet. O seu IP real não foi exposto.</p>
  <div class="why" id="r"></div>
  <p class="meta">O programa confere o proxy de novo sozinho e esta aba volta para a página quando ele funcionar.</p>
  <div class="row"><button id="go">Tentar agora</button><span class="meta" id="cd"></span></div>
</div></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('p').textContent = q.get('p') || '';
  document.getElementById('r').textContent = 'Motivo: ' + (q.get('r') || 'conferindo o proxy…');
  const u = q.get('u') || '';
  const go = () => { if (/^https?:/i.test(u)) location.href = u; else location.reload(); };
  document.getElementById('go').onclick = go;
  let n = 20; const cd = document.getElementById('cd');
  setInterval(() => { n--; cd.textContent = n > 0 ? `nova tentativa em ${n} s` : 'tentando…'; if (n <= 0) { n = 20; go(); } }, 1000);
</script>
</body>
</html>
